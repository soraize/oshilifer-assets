name: Build search index

# data/ のJSONを直してpushすると、推し検索用の data/search_index.json を自動で作り直す。
on:
  push:
    branches: [main]
    paths:
      - "data/*.json"
      - "tools/build_search_index.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: python3 tools/build_search_index.py
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain data/search_index.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/search_index.json
            git commit -m "Update search index [skip ci]"
            git push
          else
            echo "No change"
          fi
